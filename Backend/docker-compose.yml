version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: neuroguard_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: neuroguard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    container_name: neuroguard_api
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:password123@postgres:5432/neuroguard
      NEUROGUARD_BOT_TOKEN: ${NEUROGUARD_BOT_TOKEN}
      NEUROGUARD_INTERNAL_API_TOKEN: ${NEUROGUARD_INTERNAL_API_TOKEN}
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: